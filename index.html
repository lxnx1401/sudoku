<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung Sodoku</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Verdana, Tahoma;
            letter-spacing: 2px;
            color: white;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgba(66, 41, 41, 0.932);
        }

        h1 {
            font-family: "Brush Script MT", "Brush Script Std", cursive;
            /* Dein Header-Style */
            font-size: 80px;
            margin-bottom: 30px;
            text-transform: none;
            /* Schreibschrift sieht ohne uppercase besser aus */
        }

        #username {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            margin-bottom: 20px;
            outline: none;
            width: 250px;
            text-align: center;
            transition: border 0.3s;
        }

        #username:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        button {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: white;
            color: black;
        }

        /* Platzhalter-Farbe anpassen */
        ::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>SUDOKU</h1>
        <input type="text" id="username" placeholder="Wie willst du heißen?">
        <button onclick="saveName()">Starten</button>
    </div>

    <script>
        function saveName() {
            const name = document.getElementById('username').value;
            if (name) {
                localStorage.setItem('spielerName', name);
                window.location.href = 'sudoku.html'; // Name deiner Hauptdatei
            }
        }
    </script>
</body>

</html>
